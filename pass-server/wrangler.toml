name = "pos-pass-server"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "REGS"
id = "16a30696fd3e4f7c834c0895289e51d4"   # wrangler kv namespace create REGS

[vars]
GIFT_CARD_PASSES = "off"   # "on" re-enables gift-card Wallet passes (also needs the Shopify/APNs/AUTH_SECRET secrets, see README)
