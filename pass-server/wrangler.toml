name = "pos-pass-server"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "REGS"
id = "3842510bd47c4a34a9f4312ec44f84ad"   # wrangler kv namespace create REGS

[vars]
GIFT_CARD_PASSES = "off"   # "on" re-enables gift-card Wallet passes (also needs the Shopify/APNs/AUTH_SECRET secrets, see README)

[[routes]]
pattern = "pass.pos.aidens3dp.com"
zone_name = "aidens3dp.com"
custom_domain = true
